name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  spikes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r spikes/requirements.txt -e packages/proto/python -e packages/block-sdk/python -e packages/trace/python -e packages/certifier/python -e apps/server
      - name: spikes 全量（离线单测 116；4 个真浏览器用例 deselect——CI 不装 chromium，真浏览器验证留本地/部署清单）
        run: |
          python -m pytest spikes -q \
            --deselect spikes/test_browser_link.py::test_patchright_open_read_screenshot \
            --deselect spikes/test_manual_block.py::test_search_to_excel_report \
            --deselect spikes/test_site_inspect.py::test_live_front_report \
            --deselect spikes/test_site_inspect.py::test_live_search_page_report

  apps-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r spikes/requirements.txt -e packages/proto/python -e packages/block-sdk/python -e packages/trace/python -e packages/certifier/python -e apps/server
      - name: apps/server + packages 全量（sqlite 载体）
        run: python -m pytest apps/server/tests apps/runner/tests packages/block-sdk/tests packages/proto/tests packages/trace/tests packages/certifier/tests -q

  server-pg:
    # PG 兼容正式验证（docs/16 T1.81/T1.83）——禁只拿 sqlite 绿宣称 PG 可用
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORGE_TEST_DB_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r spikes/requirements.txt -e packages/proto/python -e packages/block-sdk/python -e packages/trace/python -e packages/certifier/python -e 'apps/server[pg]'
      - name: PG 连通性预检（失败时直接指认容器/凭据层）
        run: |
          pg_isready -h localhost -p 5432
          PGPASSWORD=postgres psql -h localhost -U postgres -tAc 'select version();'
      - name: apps/server 全量（PG 载体，逐测试独立库）
        run: python -m pytest apps/server/tests -q
