[project]
name = "forge-server"
version = "0.1.0"
description = "Forge 认证流水线服务端：CertScheduler/certification_runs/C2 执行器/报告 REST（M09 编码，docs/12）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "PyYAML>=6.0",
    "cryptography>=42",
]

[project.optional-dependencies]
# 生产 PG 载体（docs/16 决策 1）：镜像与 CI 装 `.[pg]`；本地开发缺省 sqlite 不装
pg = ["psycopg[binary]>=3.1"]
