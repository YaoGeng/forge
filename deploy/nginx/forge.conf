# /opt/aim/infra/nginx/conf.d/forge.conf（部署标准 §5.3 模板 + 容器化寻址注记实例化）
# v0.2（T2.22）：买家公开面豁免 Basic（商店/账号/下载/上报）；管理域（registry/
# certifications/creator/admin）维持 Basic——应用层鉴权由 forge-server 承担
# v0.3（MS-3 T5）：`/` 门户公开化（portal 静态 export）+ /admin/ web-admin 静态
# （Basic 继承全局）+ = /creator 精确匹配保漏；<serving>=/opt/aim/infra/nginx/serving
# （R6：容器静态卷挂载路径待用户部署前确认，见 SERVER_STEPS §10）
server {
    listen 443 ssl;
    server_name forge.aim8848.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    server_tokens off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 全站 Basic（页面+API 一体，Creator UI 同域自动携带；后端应用层鉴权 = MS-2 交付）
    auth_basic "Forge";
    auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;

    # 容器化 nginx 寻址（标准 5.3 注记）：DNS 解析推迟到请求期，后端容器不在也不拖垮其他产品
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://forge-backend:8041;

    # ---------- 买家公开面（T2.22 豁免清单：匿名可达；headers 与管理域同款——
    # 应用层 IP 限频依赖 X-Forwarded-For，后端仅回环可达故可信） ----------
    location = /healthz { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /static/   { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; }
    location /download/ {  # 运行器分发（T2.13）：与 compose ./dist 同源
        auth_basic off;
        alias /opt/aim/forge/dist/;
        autoindex off;
    }
    location = /login    { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /register { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /store      { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /me/        { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }  # 买家「我的应用」页（web.py /me/library，T5.1 审计裁决补：否则被门户 root 吞）
    location /api/v1/auth/       { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/v1/pubkey      { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/v1/run-reports { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/v1/me          { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/v1/entitlements/ { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/v1/store/      { auth_basic off; proxy_pass $upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # ---------- 管理域（维持 Basic：registry/certifications/creator/admin/stats） ----------
    # 后端接口（后端原生 /api/v1 前缀，反代不剥前缀）
    location /api/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        limit_req zone=api burst=40 nodelay;   # zone 定义在共享 00-hardening.conf（跨仓契约）
    }

    # web-admin 静态产物（MS-3 T2）：统一 root <serving> 布局（<serving>/admin/ 下即
    # dist 内容），规避 alias+try_files 经典坑；块内不写 auth_basic = 继承全局（管理域 Basic 不变）
    location /admin/ {
        root /opt/aim/infra/nginx/serving;
        try_files $uri /admin/index.html;
    }

    # /creator 页面保漏（MS-3 T5）：门户 root 接管 `/` 后无本块即被 portal 吞；
    # 其 XHR 走 /api/v1/creator/*（上方 /api/ 块）。proxy 参数原样沿用旧 `location /`
    location = /creator {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        limit_req zone=api burst=40 nodelay;   # zone 定义在共享 00-hardening.conf（跨仓契约）
    }

    # ---------- 门户公开化（MS-3 T3；R7 豁免——本次唯一鉴权面放宽） ----------
    # 豁免边界依据：nginx 取最长前缀匹配（= 精确匹配最优先、与书写顺序无关），上方既有
    # 精确/前缀 location（/api/、/api/v1/*、/store、/login、/register、/static/、/download/、
    # = /healthz、= /creator、/admin/）均比 `/` 更长而先行命中——买家公开面与管理域的
    # Basic/豁免口径不受本块影响；本块 auth_basic off 仅暴露门户静态产物（<serving>/portal）
    location / {
        auth_basic off;
        root /opt/aim/infra/nginx/serving/portal;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name forge.aim8848.com;
    return 301 https://$host$request_uri;
}
