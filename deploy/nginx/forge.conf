# /opt/aim/infra/nginx/conf.d/forge.conf（部署标准 §5.3 模板 + 容器化寻址注记实例化）
# v0：整站反代后端（无独立 www 构建）；全站 Basic Auth（docs/16 决策 2——阶段 1 无应用层鉴权）
server {
    listen 443 ssl;
    server_name forge.aim8848.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    server_tokens off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 全站 Basic（页面+API 一体，Creator UI 同域自动携带；后端应用层鉴权 = MS-2 交付）
    auth_basic "Forge";
    auth_basic_user_file /etc/nginx/conf.d/admin.htpasswd;

    # 容器化 nginx 寻址（标准 5.3 注记）：DNS 解析推迟到请求期，后端容器不在也不拖垮其他产品
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://forge-backend:8041;

    # 后端接口（后端原生 /api/v1 前缀，反代不剥前缀）
    location /api/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        limit_req zone=api burst=40 nodelay;
    }

    # 其余整站（/ 门户路由、/creator、/healthz 探活）
    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        limit_req zone=api burst=40 nodelay;
    }
}

server {
    listen 80;
    server_name forge.aim8848.com;
    return 301 https://$host$request_uri;
}
