# com.forge-spike.pf.conf — Forge MS-1A spike 规则模板（未实测，待 macOS 硬件）
# 语义：专用用户 _forge_comp 出站默认阻断，仅放行 loopback → 本地代理端口。
# __PROXY_PORT__ 由 setup_pf.sh 以实际代理端口替换后装载（终审 Important-4：
# 端口放行必须收窄到代理端口，放行任意 loopback 会破坏白名单语义）。
# 装载（anchor 方式，优先）：sudo pfctl -a forge-spike -f <生成的 conf>
# 卸载：sudo pfctl -a forge-spike -F all
# 注意：pf 规则 last-match-wins——先 block 全部出站，再 pass 到代理端口。

block drop out inet proto { tcp, udp } from any to ! 127.0.0.1 user _forge_comp
pass  out inet proto { tcp, udp } from any to 127.0.0.1 port __PROXY_PORT__ user _forge_comp
