# com.forge-spike.pf.conf — Forge MS-1A spike（未实测，待 macOS 硬件）
# 语义：专用用户 _forge_comp 出站默认阻断，仅放行 loopback（含到本地代理端口）。
# 装载（anchor 方式，优先）：sudo pfctl -a forge-spike -f com.forge-spike.pf.conf
# 卸载：sudo pfctl -a forge-spike -F all
# 注意：pf 规则 last-match-wins——先 block 全部出站，再 pass loopback。

block drop out inet proto { tcp, udp } from any to ! 127.0.0.1 user _forge_comp
pass  out inet proto { tcp, udp } from any to 127.0.0.1 user _forge_comp
