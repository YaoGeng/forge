# 种子积木库 manifest（docs/13 §5 T1.60 备案的可机读镜像；05 附录 A.9 为备案正本）
schema_version: 1

scenarios:
  - {id: s1_search_digest, title: 搜索聚合读取}
  - {id: s3_catalog_read, title: 目录/书目读取}
  - {id: s4_text_extract, title: 文本抽取}
  - {id: s5_public_api, title: 公开 API 数据拉取}
  - {id: s6_repo_meta, title: 仓库元数据查询}
  - {id: s7_home_watch, title: 高变更首页监控}
  - {id: s8_data_export, title: 数据导出}
  - {id: s9_text_digest, title: 文本汇总整理}

sites:
  hn.algolia.com: {tier: medium}       # 既有（MS-1E C2 seed）
  saucedemo.com: {tier: standard}      # 既有（MS-1E C1 seed；平台自持公开测试账号）
  baidu.com: {tier: high}              # C4 高变更例外（MS-1D C1-R2 改版实证）
  cn.bing.com: {tier: standard}
  books.toscrape.com: {tier: standard} # 公开爬虫练习站（官方供抓取）
  quotes.toscrape.com: {tier: standard}
  registry.npmmirror.com: {tier: standard}      # 公开 registry API
  httpbin.org: {tier: standard}        # 公开 HTTP 测试服务
  api.github.com: {tier: standard}     # 公开 REST API
  jsonplaceholder.typicode.com: {tier: standard} # 公开假数据 API
  export.arxiv.org: {tier: standard}      # 公开 Atom API（A.9 R2③；公开学术 API 无反爬声明）

blocks:
  # ── 批次一：场景 1/3/4/7 + 既有两块（48h 时钟最早起跑）──
  - {name: bing_search, site: cn.bing.com, scenario: s1_search_digest, level: C2,
     script: site_scripts.bing_search:browse, params: {q: browser automation}, batch: 1, adapter: trace}
  - {name: hn_search_probe, site: hn.algolia.com, scenario: s1_search_digest, level: C2,
     script: site_scripts.hn_search_probe:browse, params: {q: python}, batch: 1, adapter: trace,
     exists: true, legacy_state_key: c2}
  - {name: books_list, site: books.toscrape.com, scenario: s3_catalog_read, level: C2,
     script: site_scripts.books_list:browse, params: {}, batch: 1, adapter: trace}
  - {name: book_detail, site: books.toscrape.com, scenario: s3_catalog_read, level: C2,
     script: site_scripts.book_detail:browse, params: {}, batch: 1, adapter: trace}
  - {name: quotes_list, site: quotes.toscrape.com, scenario: s4_text_extract, level: C2,
     script: site_scripts.quotes_list:browse, params: {}, batch: 1, adapter: trace}
  - {name: quotes_paged, site: quotes.toscrape.com, scenario: s4_text_extract, level: C2,
     script: site_scripts.quotes_paged:browse, params: {tag: love}, batch: 1, adapter: trace}
  - {name: baidu_home_watch, site: baidu.com, scenario: s7_home_watch, level: C2,
     script: site_scripts.baidu_home_watch:browse, params: {}, batch: 1, adapter: trace}

  # ── 批次二：场景 5/6/8/9 ──
  - {name: npm_pkg_meta, site: registry.npmmirror.com, scenario: s5_public_api, level: C2,
     script: site_scripts.npm_pkg_meta:browse, params: {pkg: pytest}, batch: 2, adapter: trace}
  - {name: httpbin_echo, site: httpbin.org, scenario: s5_public_api, level: C2,
     script: site_scripts.httpbin_echo:browse, params: {echo: hello-forge}, batch: 2, adapter: trace}
  - {name: jsonplaceholder_posts, site: jsonplaceholder.typicode.com, scenario: s5_public_api, level: C2,
     script: site_scripts.jsonplaceholder_posts:browse, params: {post_id: "1"}, batch: 2, adapter: trace}
  - {name: github_repo_read, site: api.github.com, scenario: s6_repo_meta, level: C2,
     script: site_scripts.github_repo_read:browse, params: {repo: microsoft/vscode}, batch: 2, adapter: trace}
  - {name: github_search, site: api.github.com, scenario: s6_repo_meta, level: C2,
     script: site_scripts.github_search:browse, params: {q: playwright, per_page: "5"}, batch: 2, adapter: trace}
  - {name: excel_export, site: null, scenario: s8_data_export, level: C2,
     script: null, params: {rows: "[]", out: report.xlsx}, batch: 2, adapter: python}
  - {name: csv_export, site: null, scenario: s8_data_export, level: C2,
     script: null, params: {rows: "[]", out: report.csv}, batch: 2, adapter: python}
  - {name: markdown_export, site: null, scenario: s8_data_export, level: C2,
     script: null, params: {rows: "[]", out: report.md}, batch: 2, adapter: python}
  - {name: text_digest, site: null, scenario: s9_text_digest, level: C2,
     script: null, params: {lines: "alpha;beta;gamma"}, batch: 2, adapter: python}
  - {name: text_clean, site: null, scenario: s9_text_digest, level: C2,
     script: null, params: {text: "  Hello   World  "}, batch: 2, adapter: python}
  - {name: text_stats, site: null, scenario: s9_text_digest, level: C2,
     script: null, params: {text: the quick brown fox}, batch: 2, adapter: python}

  # ── D-4 收窄新块（A.9 R2③；batch:1，T1.77 认证批次）──
  - {name: url_read, site: null, scenario: s4_text_extract, level: C2,
     script: null, params: {url: "https://books.toscrape.com/"}, batch: 1, adapter: python}
  - {name: table_read, site: null, scenario: s4_text_extract, level: C2,
     script: null, params: {url: "https://docs.python.org/3/library/string.html", index: 0}, batch: 1, adapter: python}
  - {name: json_export, site: null, scenario: s8_data_export, level: C2,
     script: null, params: {rows: "alpha;beta", out: report.json}, batch: 1, adapter: python}
  - {name: arxiv_search, site: export.arxiv.org, scenario: s5_public_api, level: C2,
     script: site_scripts.arxiv_search:browse, params: {}, batch: 1, adapter: trace}

# ── 保留清单（能力底座，注册/认证留存，不进场景承诺；A.9 R2 ⑤）──
# 以下块随 s2_login_inventory/s10_numeric_calc 场景裁撤移出 blocks[]，目录/认证/注册不动：
#   login_demo_probe（s2，C1，saucedemo.com 登录探针——30 样本中登录类真实需求全落排除域，域内命中 0）
#   price_calc（s10，单价×数量）
#   stats_summary（s10，数值序列统计——非文本汇总，禁止为留而归）
#   unit_convert（s10，厘米→米/英尺）
